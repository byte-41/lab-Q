<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Gean Carlos">
    <meta name="description" content="Acceso privado al panel del laboratorio y gestión de usuarios.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.png">
    <title>Acceso | Laboratorio Quimico</title>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Laboratorio Quimico</h1>
            <p class="login-descripcion">Acceso al panel interno</p>

            <div id="mensaje-login" class="mensaje-login" hidden></div>

            <form id="form-login" class="form-login">
                <div class="form-group">
                    <label for="email-login">Correo electrónico</label>
                    <input id="email-login" type="email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="password-login">Contraseña</label>
                    <input id="password-login" type="password" placeholder="Introduce tu contraseña" required>
                </div>

                <div class="checkbox-grupo">
                    <input id="recuerda" type="checkbox">
                    <label class="label-checkbox" for="recuerda">Recordarme</label>
                </div>

                <button class="action-button" type="submit">Iniciar sesión</button>
            </form>

            <div class="divider"></div>

            <p class="link-olvido">
                <a href="#" id="btn-demo">Ver credenciales de prueba</a>
            </p>

            <div id="demo-usuarios" class="demo-usuarios" hidden>
                <table class="tabla-demo">
                        <tr>
                            <th>Correo</th>
                            <th>Contraseña</th>
                            <th>Tipo</th>
                        </tr>
                        <tr>
                            <td>director@lab.es</td>
                            <td>admin123</td>
                            <td>Director</td>
                        </tr>
                        <tr>
                            <td>tecnico@lab.es</td>
                            <td>tech123</td>
                            <td>Técnico</td>
                        </tr>
                        <tr>
                            <td>cliente@lab.es</td>
                            <td>cliente123</td>
                            <td>Cliente</td>
                        </tr>
                </table>
            </div>
        </div>
    </div>

    <script src="js/java.js"></script>
</body>
</html>
